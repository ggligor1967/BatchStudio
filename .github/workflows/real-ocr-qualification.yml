name: Controlled real OCR qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-ocr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-ocr-qualification:
    name: real-ocr-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFICATION_REPOSITORY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up exact Python 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: qualification/real_ocr/requirements.txt
      - name: Configure runner-local qualification paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'QUALIFICATION_ARTIFACT_DIR=%s/batchstudio-real-ocr\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TESSDATA_PREFIX=%s/batchstudio-real-ocr/tessdata\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Record repository and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_REPOSITORY_SHA"
          printf 'EVENT_GITHUB_SHA=%s\n' "$GITHUB_SHA"
          printf 'QUALIFICATION_REPOSITORY_SHA=%s\n' "$QUALIFICATION_REPOSITORY_SHA"
          printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\nImageOS=%s\nImageVersion=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-UNSET}" "${ImageVersion:-UNSET}"
          cat /etc/os-release
          uname -a
      - name: Download checksum-verified OCR artifacts
        run: >-
          python qualification/real_ocr/download_toolchain.py
          --destination "$QUALIFICATION_ARTIFACT_DIR"
      - name: Install exact Tesseract and Poppler packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "$QUALIFICATION_ARTIFACT_DIR/tesseract-ocr_5.3.4-1build5_amd64.deb" \
            "$QUALIFICATION_ARTIFACT_DIR/poppler-utils_24.02.0-1ubuntu9.9_amd64.deb"
      - name: Install exact Python qualification packages
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==25.2
          python -m pip install --disable-pip-version-check -r qualification/real_ocr/requirements.txt
          python -m pip check
          python -m pip freeze --all
      - name: Verify toolchain, fixtures, and exact commit
        run: >-
          python qualification/real_ocr/verify_environment.py
          --artifact-directory "$QUALIFICATION_ARTIFACT_DIR"
      - name: Verify fixture byte reproducibility
        run: python qualification/real_ocr/generate_fixtures.py --check
      - name: Run controlled real-OCR qualification
        run: python -m pytest -q qualification/real_ocr/test_real_ocr.py -ra

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-windows-py310:
    name: ci-windows-py310
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile supported Python sources
        run: python -m compileall core ui tests main.py test_installation.py test_pdf_merge_fix.py test_pdf_merge_simple.py
      - name: Run the non-interactive suite
        run: pytest -q

  ci-windows-py312:
    name: ci-windows-py312
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile supported Python sources
        run: python -m compileall core ui tests main.py test_installation.py test_pdf_merge_fix.py test_pdf_merge_simple.py
      - name: Run the non-interactive suite
        run: pytest -q

  ci-ubuntu-py312:
    name: ci-ubuntu-py312
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tk import support
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile supported Python sources
        run: python -m compileall core ui tests main.py test_installation.py test_pdf_merge_fix.py test_pdf_merge_simple.py
      - name: Run the non-interactive suite
        run: pytest -q

  release-regressions:
    name: release-regressions
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Report optional OCR runtime capability
        run: python -c "import shutil; print('Tesseract=' + (shutil.which('tesseract') or 'UNAVAILABLE')); print('Poppler-pdfinfo=' + (shutil.which('pdfinfo') or 'UNAVAILABLE'))"
      - name: Run release regression checks
        run: |
          pytest -q test_installation.py
          pytest -q tests/test_e2e_release_blockers.py
          python test_installation.py

  repository-truth:
    name: repository-truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history for changed-line verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository truth
        run: python scripts/verify_repository.py

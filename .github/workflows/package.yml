name: Package validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-build-install:
    name: package-build-install
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install current build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Audit artifacts and isolated wheel installation
        run: python scripts/verify_package.py --dist-dir dist --expected-version 1.0.1

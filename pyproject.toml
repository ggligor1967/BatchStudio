[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchstudio"
version = "1.0.1"
description = "A Tkinter desktop application for registry-backed batch file workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "BatchStudio Team"}
]
keywords = ["batch", "processing", "files", "images", "pdf", "csv", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
dnd = [
    "tkinterdnd2>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/ggligor1967/BatchStudio"
Documentation = "https://github.com/ggligor1967/BatchStudio#readme"
Repository = "https://github.com/ggligor1967/BatchStudio"
Issues = "https://github.com/ggligor1967/BatchStudio/issues"

[project.scripts]
batchstudio = "main:main"

[project.gui-scripts]
batchstudio-gui = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
